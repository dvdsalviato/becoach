name: becoach
description: BeCoach - l'app per coach e allenati.
publish_to: 'none'
version: 1.6.1+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0
  google_sign_in: ^6.2.2
  http: ^1.2.2
  image_picker: ^1.1.2
  package_info_plus: ^8.1.0
  flutter_local_notifications: ^18.0.1
  timezone: any
  android_alarm_manager_plus: ^4.0.3
  shared_preferences: ^2.3.2
  web: ^1.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/esercizi/
