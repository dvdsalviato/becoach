name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.29.3
          cache: true

      - name: Completa i file Android mancanti (icone, temi)
        run: |
          flutter --version
          flutter create --platforms=android --org com.dvdsalviato --project-name becoach .
          rm -rf test
          # usiamo solo i file Gradle in Kotlin (.kts) del repo
          rm -f android/build.gradle android/settings.gradle android/app/build.gradle

      - name: Controlla google-services.json
        run: test -f android/app/google-services.json || (echo "Manca android/app/google-services.json" && exit 1)

      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/becoach.p12
          ls -l android/app/becoach.p12
          if keytool -list -keystore android/app/becoach.p12 -storetype PKCS12 -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" > /dev/null; then
            echo "Keystore e password OK"
          else
            echo "::error::La password del keystore (secret KEYSTORE_PASSWORD) o l'alias (KEY_ALIAS) non corrispondono al file becoach.p12"
            exit 1
          fi

      - run: flutter pub get

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Rinomina APK
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          cp build/app/outputs/flutter-apk/app-release.apk BeCoach-$VERSION-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BeCoach-${{ env.VERSION }}-${{ github.run_number }}
          path: BeCoach-*.apk

      - name: Release scaricabile dal telefono
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}-${{ github.run_number }}" BeCoach-*.apk \
            --title "BeCoach ${VERSION} (build ${{ github.run_number }})" \
            --notes-file WHATSNEW.md

      - name: Pubblica sul repo pubblico (aggiornamenti dentro l'app)
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Secret PUBLIC_RELEASE_TOKEN non impostato: salto la pubblicazione pubblica"
            exit 0
          fi
          gh release create "v${VERSION}-${{ github.run_number }}" BeCoach-*.apk \
            -R dvdsalviato/becoach-download \
            --title "BeCoach ${VERSION} (build ${{ github.run_number }})" \
            --notes-file WHATSNEW.md
